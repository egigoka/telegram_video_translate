services:
  vot-cli-service:
    build:
      context: .
      network: host
    volumes:
      - ./scripts:/usr/src/app/scripts
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/renderD129:/dev/dri/renderD129
    command: ["sh", "/usr/src/app/scripts/update_vot_cli.sh"]
    labels:
          - "com.centurylinklabs.watchtower.enable=false"
